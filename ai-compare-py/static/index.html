<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Compare</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-900 dark:bg-stone-950 dark:text-stone-100 font-sans antialiased">
<main class="mx-auto max-w-6xl px-4 py-10">
  <h1 class="text-3xl font-semibold tracking-tight">AI Compare</h1>
  <p class="mt-1 text-stone-500 dark:text-stone-400">Send one task to several AI models, compare the answers, keep the best one.</p>

  <section class="mt-8">
    <h2 class="font-medium">1. Choose at least two models</h2>
    <div id="chips" class="mt-3 flex flex-wrap gap-2"></div>
  </section>

  <section class="mt-8">
    <h2 class="font-medium">2. Describe the task</h2>
    <textarea id="prompt" rows="4" class="mt-3 w-full rounded-lg border border-stone-300 bg-white p-3 focus:outline-none focus:ring-2 focus:ring-emerald-600 dark:border-stone-700 dark:bg-stone-900" placeholder="e.g. Explain recursion to a ten-year-old in three sentences."></textarea>
    <div class="mt-3 flex items-center gap-3">
      <button id="send" disabled class="rounded-lg bg-emerald-700 px-5 py-2 font-medium text-white hover:bg-emerald-800 disabled:cursor-not-allowed disabled:opacity-40">Send to selected models</button>
      <span id="hint" class="text-sm text-stone-500">Select 2 or more models.</span>
    </div>
  </section>

  <section id="results" class="mt-10 hidden">
    <h2 class="font-medium">3. Compare outputs</h2>
    <div id="grid" class="mt-3 grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
  </section>

  <section id="final" class="mt-10 hidden rounded-xl border border-emerald-700 bg-white p-5 dark:bg-stone-900">
    <h2 class="font-medium">4. Continue with <span id="fname"></span></h2>
    <div id="ftext" contenteditable="true" class="mt-3 min-h-[5rem] whitespace-pre-wrap rounded border border-dashed border-stone-300 p-3 focus:outline-none focus:ring-2 focus:ring-emerald-600 dark:border-stone-700"></div>
    <div class="mt-3 flex flex-wrap items-center gap-3">
      <button id="copy" class="rounded-lg bg-emerald-700 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-800">Copy</button>
      <button id="refine" class="rounded-lg border border-stone-300 px-4 py-2 text-sm dark:border-stone-700">Refine with a follow-up</button>
      <span id="fmsg" class="text-sm text-stone-500">You can edit the text above directly.</span>
    </div>
    <div id="refrow" class="mt-3 hidden gap-2">
      <input id="follow" class="flex-1 rounded-lg border border-stone-300 bg-white px-3 py-2 dark:border-stone-700 dark:bg-stone-900" placeholder="e.g. Make it shorter and more playful">
      <button id="go" class="rounded-lg bg-emerald-700 px-4 py-2 text-sm font-medium text-white disabled:opacity-40">Send</button>
    </div>
  </section>

  <details class="mt-10">
    <summary class="cursor-pointer font-medium">Recent choices</summary>
    <ul id="history" class="mt-3 space-y-2 text-sm"></ul>
  </details>
</main>
<script src="/app.js"></script>
</body>
</html>
